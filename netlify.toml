[build]
	command = "vite build"
    functions = "lambda"

[functions.webhooks]
    background = true

[dev]
    command = "vite"

[[redirects]]
    from = "/"
    to = "/index.html"
    status = 200

[[headers]]
    for = "/manifest.webmanifest"
    [headers.values]
        Content-Type = "application/manifest+json"

[context.dev.environment]
    NODE_ENV = "DEV"
[context.deploy-preview.environment]
    NODE_ENV = "PREVIEW"
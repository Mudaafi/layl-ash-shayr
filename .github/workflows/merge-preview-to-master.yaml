# .github/workflows/auto-merge.yaml
name: Merge Preview to Master
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Only run on preview
        if: github.ref_name != 'preview'
        run: |
          echo "ERROR: This manual workflow can only be run from the 'preview' branch."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: merge preview into master locally
        run: |
          git checkout master
          git pull
          git merge preview -m "GHA - Merge preview to master"

      - name: update preview to prevent PR from closing
        run: |
          git checkout preview
          echo $RANDOM > random.txt
          git add *
          git commit -m "GHA - Update preview branch"
          git push

      - name: push merge
        run: |
          git checkout master
          git push

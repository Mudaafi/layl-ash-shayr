# .github/workflows/auto-merge.yaml
name: Merge Preview to Master
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to merge to master'
        required: true
        default: 'preview'
        type: string

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Only run on preview
        if: github.ref_name != 'preview'
        run: |
          echo "ERROR: This manual workflow can only be run from the 'preview' branch."
          exit 1

      - uses: actions/checkout@v4

      - name: test echo
        run: |
          echo "${{inputs.branch}}"

      - name: test merge
        run: |
          echo "attempting merge"
          git fetch origin master:master
          git checkout master
          git pull
          git merge preview -m "GHA - Merge preview to master"
          git push
